services:
  postgres:
    image: postgres:16
    container_name: ifood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifood_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    expose:
      - "5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: ifood-client
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000
    volumes:
      - ../client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres

volumes:
  postgres_data:
