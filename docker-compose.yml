services:
  postgres:
    image: postgres:16
    container_name: ifood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifood_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    expose:
      - "5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: